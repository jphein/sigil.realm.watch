[package]
name = "realm-sigil"
version = "0.1.0"
edition = "2021"
description = "Deterministic magical name generation — the Rust binding. no_std, no alloc, no deps."
license = "MIT"
repository = "https://github.com/jphein/realm-sigil"

[lib]
name = "realm_sigil"
path = "src/lib.rs"

# Deliberately dependency-free. This crate is consumed by bare-metal firmware (smol's ESP32-C3),
# where every dependency is flash, and by host tools in the same workspace. A word table and two
# modulo operations do not need a dependency tree.
[dependencies]

[features]
# Default exposes every realm that cannot disagree with go/python/js. As of the 2026-07-29
# `sync-words.sh --all`, that is **all nine** — see below.
default = []

# Opt in to realms whose corpus is CORPUS-DIVERGENT from the go/python/js bindings.
#
# The feature is named after the hazard rather than the capability, because enabling it is not
# "turn on more realms" — it is "accept that this binding's version names may disagree with the
# other three". Indices are `% len(list)`, so the same arithmetic over different word lists yields
# a different name for the same hash, and a project consuming two bindings would publish two
# version names for one commit. That is a silent, plausible-looking wrong answer — the worst kind —
# so reaching such a realm requires writing this feature name into a Cargo.toml, where a reviewer
# sees it.
#
# ## As of 2026-07-29 the divergent set is EMPTY
#
# `./sync-words.sh --all` regenerated every binding from `words/realms.json`, landing the
# 2026-05-07 lexicon cutover that go/python/js had been frozen behind since 2026-04-05. All four
# bindings now agree — verified directly: `9e3779b1` in `fantasy` is `Draconic Monolith · 9e3779b1`
# in go, python, js and rust alike. Two bindings generated from one source cannot disagree, so no
# realm is gated and this feature currently changes nothing about which realms exist.
#
# It is kept, not deleted, because the generator derives the gate from a **content** comparison
# against the Go embed on every run. A future partial sync (`--only rust`) that changes one word
# list re-gates exactly the affected realm, drops it from the default `REALMS`, and fails
# `default_build_exposes_only_non_divergent_realms` with its name. The mechanism is the guard; the
# empty set is just today's state.
#
# The one-time cost of converging was renaming the generated version name in candela,
# portal.realm.watch, coin.realm.watch and realmwatch — those names are historical record and
# appear in commits and in speech, which is why it was JP's call rather than a maintenance chore.
divergent-themed-realms = []
